<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple X-Translator</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        background: #0f1117;
        color: #e6e9ef;
      }
      h1 { font-size: 22px; }
      .hint { color: #8b94a7; font-size: 14px; margin-bottom: 20px; }
      .row { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
      button {
        font-size: 15px; padding: 10px 20px; border-radius: 8px; border: none;
        cursor: pointer; color: #fff;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      #recordBtn { background: #2563eb; }
      #stopBtn { background: #dc2626; }
      select { font-size: 15px; padding: 9px 10px; border-radius: 8px; background: #1b1f2a; color: #e6e9ef; border: 1px solid #333; }
      #status { color: #8b94a7; font-size: 14px; min-height: 20px; }
      .panel { background: #1b1f2a; border: 1px solid #2a2f3c; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
      .panel .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #6f7a90; margin-bottom: 6px; }
      .panel .value { font-size: 16px; line-height: 1.5; white-space: pre-wrap; min-height: 22px; }
      audio { width: 100%; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Simple X-Translator</h1>
    <p class="hint">点击「开始录音」说话，点击「结束录音」后自动执行 离线语音翻译：X-ASR → HY-MT → X-Voice。</p>

    <div class="row">
      <button id="recordBtn">开始录音</button>
      <button id="stopBtn" disabled>结束录音</button>
      <label>
        输出语言
        <select id="targetLang">
          <option value="en">English</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="ru">Russian</option>
          <option value="de">German</option>
        </select>
      </label>
    </div>

    <div id="status">就绪</div>

    <div class="panel">
      <div class="label">ASR 识别结果</div>
      <div class="value" id="asrText"></div>
    </div>
    <div class="panel">
      <div class="label">翻译结果</div>
      <div class="value" id="mtText"></div>
    </div>
    <div class="panel">
      <div class="label">TTS 音频</div>
      <audio id="ttsAudio" controls></audio>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
